name: CI Workflow

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0 # @see https://github.com/npm/cli/issues/8767
      - name: Install dependencies
        run: npm i && npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npx eslint --version && npm run lint
      - name: Check fmt
        run: npm run fmt
      - name: Build
        run: npm run build
